name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API typecheck and tests (PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The runner image ships PostgreSQL 16, stopped. The tests create their own
      # databases through the postgres user (su postgres), which needs root.
      - name: Start PostgreSQL 16
        run: |
          psql --version | grep -q ' 16\.' || { psql --version; echo "Expected PostgreSQL 16"; exit 1; }
          sudo systemctl start postgresql.service
          pg_isready --timeout=30

      # The postgres user reads the migration files and runs this job's node,
      # so let it traverse the home directory to the checkout.
      - name: Let the postgres user read the checkout
        run: |
          d="$GITHUB_WORKSPACE"
          while [ "$d" != "/" ]; do sudo chmod o+x "$d"; d="$(dirname "$d")"; done
          sudo chmod -R o+rX "$GITHUB_WORKSPACE"

      - name: Tests
        run: sudo --preserve-env=PATH env "PATH=$PATH" npm test

  web:
    name: Web build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build
